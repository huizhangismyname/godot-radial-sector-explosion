<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <title>目标排序式径向扇区爆炸概念图</title>
  <desc>圆形爆炸范围被分为多个扇区。两个相同矩形目标沿向下方向排列，目标一使用橙色显示从圆心到目标边缘的推进区段，目标二使用青色显示从目标一外缘到目标二的推进区段。</desc>

  <defs>
    <radialGradient id="background" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#2b241e"/>
      <stop offset="1" stop-color="#110f0d"/>
    </radialGradient>
    <linearGradient id="targetFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a7355"/>
      <stop offset="1" stop-color="#5b4030"/>
    </linearGradient>
    <linearGradient id="firstSector" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd36a" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e66d32" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="secondSector" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74e4db" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#2898a8" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f3bd55"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63d9dd"/>
    </marker>
    <clipPath id="blastClip">
      <circle cx="600" cy="390" r="340"/>
    </clipPath>
  </defs>

  <rect width="1200" height="900" fill="url(#background)"/>
  <rect x="28" y="28" width="1144" height="844" rx="18" fill="none" stroke="#5c4a3a" stroke-width="2"/>

  <text x="600" y="62" fill="#f2dec1" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" text-anchor="middle">目标排序式径向扇区爆炸</text>
  <text x="600" y="89" fill="#aa9279" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle" letter-spacing="2">TARGET-SORTED RADIAL SECTOR EXPLOSION</text>

  <!-- 爆炸圆底色 -->
  <circle cx="600" cy="390" r="340" fill="#1a1816" stroke="#d6a552" stroke-width="4"/>
  <circle cx="600" cy="390" r="255" fill="none" stroke="#4f4439" stroke-width="1" stroke-dasharray="5 8"/>
  <circle cx="600" cy="390" r="170" fill="none" stroke="#4f4439" stroke-width="1" stroke-dasharray="5 8"/>
  <circle cx="600" cy="390" r="85" fill="none" stroke="#4f4439" stroke-width="1" stroke-dasharray="5 8"/>

  <!-- 被目标一覆盖的扇区：从圆心推进到目标一近侧边缘 -->
  <path d="M 600 390 L 527 500 L 673 500 Z" fill="url(#firstSector)" stroke="#f4b34d" stroke-width="2" filter="url(#softGlow)"/>

  <!-- 被目标二覆盖的扇区：从目标一外缘继续推进到目标二近侧边缘 -->
  <path d="M 513 570 L 687 570 L 701 630 L 499 630 Z" fill="url(#secondSector)" stroke="#53ccd0" stroke-width="2" filter="url(#softGlow)"/>

  <!-- 24个径向扇区 -->
  <g clip-path="url(#blastClip)" stroke="#766453" stroke-width="1.25" opacity="0.9">
    <line x1="600" y1="390" x2="600" y2="50"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(15 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(30 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(45 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(60 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(75 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(90 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(105 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(120 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(135 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(150 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(165 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(180 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(195 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(210 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(225 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(240 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(255 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(270 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(285 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(300 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(315 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(330 600 390)"/>
    <line x1="600" y1="390" x2="600" y2="50" transform="rotate(345 600 390)"/>
  </g>

  <!-- 爆心和推进方向 -->
  <circle cx="600" cy="390" r="13" fill="#fff3c4" stroke="#e7a93c" stroke-width="5" filter="url(#softGlow)"/>
  <text x="622" y="382" fill="#ffe6a7" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">爆心</text>
  <line x1="600" y1="420" x2="600" y2="475" stroke="#f3bd55" stroke-width="4" marker-end="url(#arrowGold)"/>
  <text x="620" y="454" fill="#d6ae70" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14">由近到远结算</text>

  <!-- 两个相同的长方体目标 -->
  <g>
    <rect x="510" y="500" width="180" height="70" rx="7" fill="url(#targetFill)" stroke="#f3c36b" stroke-width="4"/>
    <line x1="523" y1="515" x2="677" y2="515" stroke="#c99b71" stroke-width="3" opacity="0.75"/>
    <circle cx="600" cy="535" r="24" fill="#271e18" stroke="#ffd36a" stroke-width="3"/>
    <text x="600" y="544" fill="#ffe6a2" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="800" text-anchor="middle">1</text>
    <path d="M 594 530 L 600 524 L 600 548 M 594 548 L 606 548" fill="none" stroke="#ffe6a2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="510" y="630" width="180" height="70" rx="7" fill="url(#targetFill)" stroke="#69dadd" stroke-width="4"/>
    <line x1="523" y1="645" x2="677" y2="645" stroke="#c99b71" stroke-width="3" opacity="0.75"/>
    <circle cx="600" cy="665" r="24" fill="#172326" stroke="#69dadd" stroke-width="3"/>
    <text x="600" y="674" fill="#a9f5f1" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="27" font-weight="800" text-anchor="middle">2</text>
    <path d="M 591 659 C 592 649, 608 649, 609 658 C 609 664, 602 668, 592 679 L 610 679" fill="none" stroke="#a9f5f1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 目标边缘标记 -->
  <line x1="465" y1="500" x2="505" y2="500" stroke="#f3bd55" stroke-width="2"/>
  <text x="455" y="505" fill="#f0c978" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" text-anchor="end">目标 1 近侧边缘</text>
  <line x1="465" y1="570" x2="505" y2="570" stroke="#63d9dd" stroke-width="2"/>
  <text x="455" y="575" fill="#81e5e5" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" text-anchor="end">目标 1 外侧边缘</text>

  <!-- 右侧解释 -->
  <g transform="translate(875 235)">
    <rect x="0" y="0" width="260" height="300" rx="12" fill="#201b17" stroke="#5c4a3a" stroke-width="2"/>
    <text x="24" y="38" fill="#ead7bd" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="19" font-weight="700">扇区推进区段</text>

    <rect x="24" y="66" width="36" height="16" rx="3" fill="url(#firstSector)"/>
    <text x="73" y="80" fill="#efcf9c" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15">目标 1 覆盖扇区</text>
    <text x="24" y="106" fill="#ad9781" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13">爆心 → 目标 1 近侧边缘</text>

    <rect x="24" y="136" width="36" height="16" rx="3" fill="url(#secondSector)"/>
    <text x="73" y="150" fill="#a8eeeb" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15">目标 2 覆盖扇区</text>
    <text x="24" y="176" fill="#86aeb1" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13">目标 1 外缘 → 目标 2 近侧边缘</text>

    <line x1="24" y1="205" x2="236" y2="205" stroke="#4d4036"/>
    <text x="24" y="235" fill="#c9b69e" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14">目标按最近几何距离排序。</text>
    <text x="24" y="260" fill="#c9b69e" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14">前方目标存活时阻挡对应扇区；</text>
    <text x="24" y="283" fill="#c9b69e" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14">被摧毁后才允许继续向后推进。</text>
  </g>

  <!-- 标注引线 -->
  <path d="M 690 535 C 770 535, 792 475, 855 430" fill="none" stroke="#f3bd55" stroke-width="2" marker-end="url(#arrowGold)"/>
  <path d="M 690 665 C 785 665, 800 530, 855 490" fill="none" stroke="#63d9dd" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <text x="600" y="832" fill="#8f7a66" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">概念示意：颜色表示扇区伤害池沿距离推进的区段，不代表额外物理查询。</text>
</svg>
